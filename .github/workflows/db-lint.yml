# Guards the deny-by-default schema conventions recorded in CLAUDE.md
# ("Database Security Conventions"). Fails the PR on any new ERROR-level
# Supabase linter finding.

name: Database lint

# This project merges feature branches straight into develop and main without
# pull requests, so a `pull_request`-only trigger would never fire. The `push`
# trigger is the real gate; `pull_request` is kept for the occasional PR.
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'supabase/migrations/**'
      - 'scripts/sql/**'
      - 'scripts/db-lint.mjs'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/sql/**'
      - 'scripts/db-lint.mjs'
  workflow_dispatch:

jobs:
  db-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Check whether the guard can run
        id: guard
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: |
          if [ -n "$POSTGRES_URL_NON_POOLING" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the Supabase linter
        if: steps.guard.outputs.active == 'true'
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: node scripts/db-lint.mjs

      - name: Warn that the guard is inactive
        if: steps.guard.outputs.active != 'true'
        run: |
          echo "::warning::Database lint guard is INACTIVE: POSTGRES_URL_NON_POOLING is not configured as a repository secret. This job is passing without checking anything. Add POSTGRES_URL_NON_POOLING (a read-only Postgres connection string) as a repo secret to make this guard enforce."
